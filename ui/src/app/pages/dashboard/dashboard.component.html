<div class="page-header">
  <div class="tabs">
    <button type="button" class="tab active">Dashboard</button>
    <button type="button" class="tab" disabled>Scheduler</button>
    <button type="button" class="tab" disabled>Live Tracking</button>
  </div>
</div>

@if (loading()) {
  <p class="message">Loading dashboard metrics…</p>
} @else if (error()) {
  <div class="message message--error">{{ error() }}</div>
} @else {
  <div class="metrics-grid">
    <article class="metric-card" data-metric="unscheduled">
      <p class="metric-card__label">Unscheduled Jobs</p>
      <p class="metric-card__value">{{ unscheduledCount() }}</p>
    </article>

    <article class="metric-card" data-metric="scheduled">
      <p class="metric-card__label">Scheduled Jobs</p>
      <p class="metric-card__value">{{ scheduledCount() }}</p>
    </article>

    <article class="metric-card" data-metric="completed">
      <p class="metric-card__label">Completed Jobs</p>
      <p class="metric-card__value">{{ completedCount() }}</p>
    </article>
  </div>
}
